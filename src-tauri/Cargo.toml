[package]
name = "lujie-careerkit-desktop"
version = "0.4.0"
description = "LuJie CareerKit desktop preview"
authors = ["LuJie CareerKit contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Chozzc/Lujie-Careerkit"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde_json = "1"
dunce = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
